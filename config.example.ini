; WinGlass 示例配置（INI 写法）：复制成 config.ini 后使用。
; 注意：程序优先读 config.yaml，两份同时存在时 INI 不生效。
; 取值范围与默认值见 README.md 的「字段参考」。

; 全局默认规则：未匹配 applications 且不在黑名单时使用。
[Global]
; 总开关：true 启用效果，false 关闭并恢复窗口样式。
enabled=true
; 界面语言：auto 跟随 Windows 显示语言，也可写 zh / en。
ui_language=auto
; 聚焦状态目标窗口透明度，范围 0.05..1.0。
active_opacity=0.60
; 失活状态目标窗口透明度，范围 0.05..1.0。
inactive_opacity=0.50
; 聚焦状态是否启用磨砂背板；false 时仍保留纯染色。
active_acrylic=true
; 全屏视频/游戏时自动恢复原窗口，不把画面染色；默认 true。
exclude_fullscreen=true
; 失活状态是否启用磨砂背板。
inactive_acrylic=true
; 聚焦状态玻璃颜色，格式 #RRGGBB。
active_tint_color=#00345A
; 失活状态玻璃颜色，格式 #RRGGBB。
inactive_tint_color=#00345A
; 聚焦状态 tint 强度，范围 0..1。
active_tint_strength=0.38
; 失活状态 tint 强度，范围 0..1。
inactive_tint_strength=0.20
; 聚焦/失活切换动画时长，单位毫秒，0 表示立即切换。
transition_ms=120

; 应用专属规则：缺省字段继承 Global，只写要覆盖的字段。
[App:msedge.exe]
exclude_fullscreen=true
active_tint_color=#353E62
inactive_tint_color=#353E62
active_tint_strength=0.40
inactive_tint_strength=0.34

; 命中进程后完全跳过，不施加任何效果。
; INI 只支持进程名；按窗口类名跳过只能在 config.yaml 里写。
[Blacklist]
LogonUI.exe=true
consent.exe=true
LockApp.exe=true
CredentialUIBroker.exe=true
TextInputHost.exe=true
ctfmon.exe=true
TabTip.exe=true
chsime.exe=true
SearchHost.exe=true
StartMenuExperienceHost.exe=true
ShellExperienceHost.exe=true
tacky-borders.exe=true
yasb.exe=true
SnippingTool.exe=true
winglass.exe=true
winglass-config.exe=true
